name: Build Windows app

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências do backend (build desktop)
        working-directory: backend
        run: pip install -r requirements-desktop.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build do front-end (modo desktop)
        working-directory: frontend
        run: |
          npm ci
          npm run build -- --mode desktop

      - name: Empacotar com PyInstaller
        working-directory: backend
        run: pyinstaller desktop/pedigree.spec --distpath dist --workpath build --noconfirm

      - uses: actions/upload-artifact@v4
        with:
          name: PedigreeColombofilico-windows
          path: backend/dist/PedigreeColombofilico.exe
