services:
  db:
    image: postgres:16.15-alpine3.24  # mesma versão da produção (SG-02)
    restart: unless-stopped
    environment:
      POSTGRES_USER: pedigree
      POSTGRES_PASSWORD: pedigree
      POSTGRES_DB: pedigree
    ports:
      # Só na própria máquina: na Wi-Fi o firewalld do Fedora libera 1025-65535 (RO-01).
      - "127.0.0.1:5436:5432"
    volumes:
      - pedigree_pgdata:/var/lib/postgresql/data

volumes:
  pedigree_pgdata:
